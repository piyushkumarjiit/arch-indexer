[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-indexer"
version = "0.1.0"
description = "Deterministic multi-language architecture indexer and doc generator"
readme = "README.md"
requires-python = ">=3.10"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
dependencies = [
    "protobuf==5.29.3",
    "tree-sitter==0.23.2",
    "tree-sitter-python==0.23.6",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-java==0.23.5",
    "pyyaml==6.0.1",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
]
browser = [
    "playwright==1.65.2",
]

[project.scripts]
arch-indexer = "arch_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arch_indexer = [
    "toolchain.toml",
    "skeletons/*.md",
    "viewer/assets/*",
    "viewer/dist/*",
    "viewer/dist/vendor/*",
    "viewer/dist/licenses/*",
    "facts/queries/*.scm",
    "rules/*.toml",
    "rules/dataflow/*/*.yaml",
    "dataflow/*.sc",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "browser: requires headless Chromium / Playwright",
    "engine: requires optional dataflow engine installed in cache",
]
